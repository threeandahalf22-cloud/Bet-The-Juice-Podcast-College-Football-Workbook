function findBucket(v,buckets){return buckets.find(x=>v>=x[0]&&v<=x[1])||null;}
function marketFavSide(b){const hs=Number(b.homeSpread);if(!Number.isFinite(hs)||Math.abs(hs)<.01)return null;return hs<0?'home':'away';}
function keyNumbersCrossed(modelAbs,marketAbs){
 const lo=Math.min(modelAbs,marketAbs),hi=Math.max(modelAbs,marketAbs);return [3,7,10,14,17,21].filter(k=>k>lo&&k<=hi);
}
function getTrendRead(r){
 const items=[];let pos=0,neg=0;
 const betHome=norm(r.edgeTeam)===norm(r.home), betAway=norm(r.edgeTeam)===norm(r.away);
 const homeIsDog=Number(r.homeSpread)>0;
 const vt=venueTrend(r.home);
 const addItem=(good,title,detail)=>items.push({good,title,detail});
 // Team-specific venue context applies only to the HOME team. It never changes the model projection.
 if(vt){
   if(Number.isFinite(vt.homeAts)){
     const good=vt.homeAts>=55,bad=vt.homeAts<=45;
     if(good||bad){
       const supports=(good&&betHome)||(bad&&betAway); supports?pos++:neg++;
       const marginText=Number.isFinite(vt.homeMargin)?` In those home games, ${canonicalTeam(r.home)} finished an average of ${vt.homeMargin>=0?'+':''}${vt.homeMargin.toFixed(2)} points relative to the closing spread.`:'';
       addItem(supports,`${canonicalTeam(r.home)} overall home ATS history: ${vt.homeAts.toFixed(1)}%`,
         `This measures how often ${canonicalTeam(r.home)} covered the point spread in home games during the historical sample, regardless of whether it was favored or an underdog.${marginText} ${supports?'That historical home profile points in the same direction as the model bet.':'That historical home profile works against the side the model currently prefers.'}`);
     }
   }

     if(ex&&totalQual(ex.overPct)){const over=ex.overPct>=53.5;addTrend(totals,{side:over?`Over ${total}`:`Under ${total}`,sideType:over?'over':'under',pct:ex.overPct,window:w,score:trendScore(ex.overPct,w,2),title:`Exact posted total ${total} — last ${w} years: Overs ${Number(ex.overPct).toFixed(1)}%`,detail:`${ex.games} games${Number.isFinite(ex.pushes)?`, ${ex.pushes} pushes`:''}; ${over?'Over':'Under'} is the historical side.`});}
     const tb=trendBucket(total,m.overview?.totalBuckets);
     if(tb&&totalQual(tb[2])){const over=tb[2]>=53.5;addTrend(totals,{side:over?`Over ${total}`:`Under ${total}`,sideType:over?'over':'under',pct:tb[2],window:w,score:trendScore(tb[2],w,1),title:`${tb[0]}–${tb[1]} total range — last ${w} years: Overs ${Number(tb[2]).toFixed(1)}%`,detail:`Range-level O/U trend; ${over?'Overs':'Unders'} have been the historical side.`});}
     const buy=(m.buyTotal||[]).find(x=>Math.abs(Number(x.total)-total)<.001);
     if(buy&&Number(buy.pushPct)>=3)addTrend(info,{side:'Key total',sideType:'info',window:w,score:Number(buy.pushPct)*w,title:`Buying off total ${total} — last ${w} years: ${Number(buy.pushPct).toFixed(1)}% push rate`,detail:`Fair-price guide: Over to −½ ${buy.overToMinusHalf}; Under to +½ ${buy.underToPlusHalf}. Sample: ${buy.games} games.`});
   });
   const kt=(CFB_ATS_TREND_DB.keys.finalTotals||[]).find(x=>Math.abs(Number(x.total)-total)<=0.5);
   if(kt)addTrend(info,{side:'Key total',sideType:'info',window:10,score:Number(kt.pct)*5,title:`Common final total near ${total}: ${kt.total} landed in ${Number(kt.pct).toFixed(1)}% of games`,detail:`${kt.games} of the 2017–2026 games in the workbook finished on exactly ${kt.total} combined points.`});
 }
 if(Number.isFinite(absLine)){const km=(CFB_ATS_TREND_DB.keys.winningMargins||[]).find(x=>Math.abs(Number(x.margin)-absLine)<=0.5&&Number(x.pct)>=3);if(km)addTrend(info,{side:'Key spread',sideType:'info',window:10,score:Number(km.pct)*5,title:`Key winning margin near ${absLine}: ${km.margin} points landed ${Number(km.pct).toFixed(1)}%`,detail:`${km.games} of the workbook's 2017–2026 completed games were decided by exactly ${km.margin} points.`});}
 ats.sort((a,b)=>b.score-a.score);totals.sort((a,b)=>b.score-a.score);info.sort((a,b)=>b.score-a.score);return{ats,totals,info};
}

function trendGroupKey(t,b){
 const z=(t.title||'').toLowerCase();
 if(z.includes('home underdog'))return 'home-dog';
 if(z.includes('true hfa'))return 'true-hfa';
 if(z.startsWith('exact '))return 'exact-spread';
 if(z.includes('spread range'))return 'spread-range';
 if(z.startsWith('home/road ats at'))return 'market-home-road';
 if(z.includes('home ats')||z.includes('home ats split'))return 'home-team-venue';
 if(z.includes('road ats'))return 'away-team-venue';
 if(z.includes('venue split')){
   const hn=(canonicalTeam(b.home)||'').toLowerCase(),an=(canonicalTeam(b.away)||'').toLowerCase();
   if(z.startsWith(hn))return 'home-team-venue';
   if(z.startsWith(an))return 'away-team-venue';
   return 'team-venue';
 }
 return 'other';
}
function trendSampleSize(t){
 const text=`${t.title||''} ${t.detail||''}`;
 let m=text.match(/([0-9]+(?:\.[0-9]+)?)\s+(?:home-underdog\s+)?games/i);if(m)return Number(m[1]);
 m=(t.title||'').match(/\(([0-9]+)-([0-9]+)(?:-([0-9]+))?\)/);if(m)return Number(m[1])+Number(m[2])+(Number(m[3])||0);
 return null;
}
function trendEvidence(t){
 const win={10:.98,7:.90,5:.82,2:.68}[Number(t.window)]||.72;
 const n=trendSampleSize(t),sample=n==null?.86:Math.min(1,.55+Math.log10(Math.max(5,n))/3);
 if(Number.isFinite(Number(t.pct))){
   const distance=Math.abs(Number(t.pct)-50);
   const strength=Math.min(1.35,Math.max(.08,(distance-1.5)/15));
   return strength*win*sample;
 }
 // True HFA is useful context, but intentionally capped below a strong ATS percentage trend.
 return Math.min(.72,Math.max(.12,Number(t.score||0)/65))*win;
}
function trendScoreLabel(v){if(v>=80)return['Elite Trend Fit','elite'];if(v>=70)return['Strong','strong'];if(v>=60)return['Positive','positive'];if(v>=45)return['Neutral','neutral'];if(v>=35)return['Negative','negative'];return['Strong Fade','fade']}
function trendComposite(b,tr){
 const grouped={};
 tr.ats.forEach(t=>{const k=trendGroupKey(t,b),side=t.sideType;if(side!=='home'&&side!=='away')return;(grouped[k]??={home:[],away:[]})[side].push(trendEvidence(t));});
 let home=0,away=0,groups=0;
 Object.values(grouped).forEach(g=>{
   const combine=a=>a.sort((x,y)=>y-x).reduce((sum,v,i)=>sum+v*(i===0?1:i===1?.35:.15),0);
   const h=combine(g.home),a=combine(g.away);if(h||a)groups++;home+=h;away+=a;
 });
 const total=home+away;
 const confidence=Math.min(1,total/3.1)*Math.min(1,.58+groups*.11);
 const net=total?(home-away)/total:0;
 const homeScore=Math.max(5,Math.min(95,50+45*net*confidence));
 const awayScore=100-homeScore;
 const lead=homeScore===awayScore?'Split':homeScore>awayScore?b.home:b.away;
 const edge=Math.abs(homeScore-awayScore);
 const hLab=trendScoreLabel(homeScore),aLab=trendScoreLabel(awayScore);
 return {homeScore,awayScore,lead,edge,homeEvidence:home,awayEvidence:away,groups,homeLabel:hLab[0],homeClass:hLab[1],awayLabel:aLab[0],awayClass:aLab[1]};
}
function totalTrendComposite(tr){
 let over=0,under=0;
 tr.totals.forEach(t=>{const e=trendEvidence(t);if(t.sideType==='over')over+=e;else if(t.sideType==='under')under+=e;});
 const total=over+under,confidence=Math.min(1,total/2.6),net=total?(over-under)/total:0;
 const overScore=Math.max(5,Math.min(95,50+45*net*confidence)),underScore=100-overScore;
 return {overScore,underScore,lead:Math.abs(overScore-underScore)<1?'Split':overScore>underScore?'Over':'Under',edge:Math.abs(overScore-underScore)};
}

function trendSupportPct(t){
 const p=Number(t?.pct);return Number.isFinite(p)?Math.max(p,100-p):NaN;
}
function trendStrengthTier(t){

 if(p>=70)return {label:'STRONG',cls:'strong',pct:p};

}

function trendConsensusMeta(b,tr,comp,tc){
 const home=tr.ats.filter(x=>x.sideType==='home').length,away=tr.ats.filter(x=>x.sideType==='away').length;
 const over=tr.totals.filter(x=>x.sideType==='over').length,under=tr.totals.filter(x=>x.sideType==='under').length;
 const atsTotal=home+away,totalTotal=over+under;
 const atsLead=Math.max(home,away),atsOther=Math.min(home,away),atsRatio=atsTotal?atsLead/atsTotal:0;

 if(atsTotal>=3 && atsRatio>=.75 && comp.edge>=20){signal='STRONG CONSENSUS';signalCls='strong';}

function pickSpreadForTeam(team,bet){
 const t=canonicalTeam(team);
 if(!bet||!t)return NaN;
 if(norm(t)===norm(canonicalTeam(bet.home)))return Number(bet.homeSpread);
 if(norm(t)===norm(canonicalTeam(bet.away)))return Number(bet.awaySpread);
 return NaN;
}
function resolvePickTeam(value,home,away){
 const raw=clean(value);
 if(!raw)return '';
 const h=canonicalTeam(home),a=canonicalTeam(away);
 const c=canonicalTeam(raw);
 if(norm(c)===norm(h))return h;
 if(norm(c)===norm(a))return a;
 const stripped=raw.replace(/[+-]?\d+(?:\.\d+)?(?:\s*[-–]\s*\d+)?/g,'').replace(/\b(pk|pick|em)\b/ig,'').trim();
 const cs=canonicalTeam(stripped);
 if(norm(cs)===norm(h))return h;
 if(norm(cs)===norm(a))return a;
 if(norm(raw).includes(norm(h))||norm(h).includes(norm(raw)))return h;
 if(norm(raw).includes(norm(a))||norm(a).includes(norm(raw)))return a;
 return c;
}

 // Opponent-quality multiplier. For offense, difficult schedules validate production.
 // For defensive vulnerability, difficult schedules REDUCE the apparent vulnerability.

   ? (1.30-.006*profile.sos)

 if(!mmHasAllSheets(offTeam)||!mmHasAllSheets(defTeam))return null;

 Object.values(MM_COMPONENTS).flat().forEach(c=>{if(!metrics[c.id])metrics[c.id]=mmMetric(offTeam,defTeam,c)});
 const category={};
 Object.entries(MM_COMPONENTS).forEach(([k,defs])=>category[k]=mmWeighted(metrics,defs));
 let total=0,w=0;
 Object.entries(MM_CATEGORY_WEIGHTS).forEach(([k,wt])=>{if(Number.isFinite(category[k])){total+=category[k]*wt;w+=wt}});
 if(w<.999)return null;
 const adv=mmTeamRow('teamAdv',offTeam);
 const rush=mmTeamRow('rushingAdv',offTeam),pass=mmTeamRow('passingAdv',offTeam);
 const scheduleProfile=mmOpponentProfile(offTeam),powerPct=mmPowerPercentile(offTeam);
 return {team:offTeam,opponent:defTeam,total:total/w,category,metrics,
  rushRate:rush?mmNum(rush['Off Rush Rate']):NaN,passRate:pass?mmNum(pass['Off Pass Rate']):NaN,
  offPlays:adv?mmNum(adv['Off Plays']):NaN,defPlays:adv?mmNum(adv['Def Plays']):NaN,
  offDrives:adv?mmNum(adv['Off Drives']):NaN,defDrives:adv?mmNum(adv['Def Drives']):NaN,
  scheduleProfile,powerPct};
}
function advancedMatchupForGame(home,away){
 const homeM=mmTeamMatchup(home,away),awayM=mmTeamMatchup(away,home);
 if(!homeM||!awayM)return {home,away,valid:false,homeM:null,awayM:null,totalGap:NaN,edgeTeam:'',confidence:0};
 const totalGap=Math.abs(homeM.total-awayM.total);
 return {home,away,valid:true,homeM,awayM,totalGap,edgeTeam:homeM.total>=awayM.total?home:away,confidence:mmGameConfidence(home,away)};
}
function mmTeamConfidence(team){
 const a=mmTeamRow('teamAdv',team);if(!a)return 0;
 const plays=Math.min(mmNum(a['Off Plays']),mmNum(a['Def Plays']));
 const drives=Math.min(mmNum(a['Off Drives']),mmNum(a['Def Drives']));
 if(!Number.isFinite(plays)||!Number.isFinite(drives))return 0;
 const playConf=Math.max(0,Math.min(1,plays/300));
 const driveConf=Math.max(0,Math.min(1,drives/40));
 return Math.sqrt(playConf*driveConf);
}
function mmGameConfidence(home,away){return Math.min(mmTeamConfidence(home),mmTeamConfidence(away))}
function advancedLineAdjustment(mm){
 if(!mm||!mm.valid)return 0;
 const directional=mm.homeM.total-mm.awayM.total;
 const raw=Math.max(-2,Math.min(2,directional/20));
 return Math.max(-1.5,Math.min(1.5,raw*mm.confidence));
}
function mmConfidenceLabel(c){return c>=.70?'HIGH':c>=.40?'MEDIUM':'LOW'}
function mmScore(v){return Number.isFinite(v)?v.toFixed(1):'—'}
function mmGrade(v){
 if(!Number.isFinite(v))return '—';
 if(v>=90)return 'A+';
 if(v>=85)return 'A';
 if(v>=80)return 'A-';
 if(v>=75)return 'B+';
 if(v>=70)return 'B';
 if(v>=65)return 'B-';
 if(v>=60)return 'C+';
 if(v>=55)return 'C';
 if(v>=50)return 'C-';
 if(v>=47)return 'D+';
 if(v>=45)return 'D';
 if(v>=42)return 'D-';
 return 'F';
}
function mmFmtRaw(v){
 if(!Number.isFinite(v))return '—';
 const a=Math.abs(v);
 if(a<=1.5)return v.toFixed(3);
 return v.toFixed(1);
}
function mmGap(mm,key){
 if(!mm||!mm.valid)return NaN;
 if(key==='total')return Math.abs(mm.homeM.total-mm.awayM.total);
 if(mm.homeM.category[key]!==undefined)return Math.abs(mm.homeM.category[key]-mm.awayM.category[key]);
 const h=Object.values(mm.homeM.metrics).find(x=>x&&x.id===key),a=Object.values(mm.awayM.metrics).find(x=>x&&x.id===key);
 return h&&a?Math.abs(h.score-a.score):NaN;
}
function mmLeader(mm,key){
 if(!mm||!mm.valid)return '';
 let h,a;
 if(key==='total'){h=mm.homeM.total;a=mm.awayM.total}
 else if(mm.homeM.category[key]!==undefined){h=mm.homeM.category[key];a=mm.awayM.category[key]}
 else{
  const hm=Object.values(mm.homeM.metrics).find(x=>x&&x.id===key),am=Object.values(mm.awayM.metrics).find(x=>x&&x.id===key);
  h=hm?.score;a=am?.score;
 }
 if(!Number.isFinite(h)||!Number.isFinite(a))return '';
 return h>=a?mm.home:mm.away;
}
function mismatchGameRows(){
 // Mismatch matchups come ONLY from the workbook's Spread sheet.

   const k=oddsGameKey(g.home,g.away);if(seen.has(k))return false;seen.add(k);return g.home&&g.away;
 }).map((g,i)=>({...g,index:i,mm:advancedMatchupForGame(g.home,g.away)}));
}

// ===== BETTING MODEL MARKET SOURCE: SPREADS SHEET =====
// The Betting Model deliberately uses state.spreadOdds (loaded from Spreads/Spread),
// not the Bets sheet, for matchup market spreads.
function numericSpread(v){
 // IMPORTANT: Number('') and Number(null) both become 0 in JavaScript.
 // Blank sportsbook cells are missing lines, NOT pick'em spreads.
 if(v===null||v===undefined)return NaN;
 const s=clean(v);
 if(!s||/^(?:--|—|n\/?a|null|undefined)$/i.test(s))return NaN;
 const n=Number(s);
 return Number.isFinite(n)?n:NaN;
}
function medianNumber(values){
 const a=values.filter(Number.isFinite).sort((x,y)=>x-y);
 if(!a.length)return NaN;
 const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function spreadSheetLine(row){
 if(!row||!row.raw)return {homeSpread:NaN,awaySpread:NaN,books:0};
 const raw=row.raw,keys=Object.keys(raw);
 const exact=(names)=>{
   for(const name of names){
     const k=keys.find(x=>clean(x).toLowerCase()===clean(name).toLowerCase());
     if(k!==undefined){const n=numericSpread(raw[k]);if(Number.isFinite(n))return n;}
   }
   return NaN;
 };
 // If the sheet has a single Home Spread / Away Spread pair, use it exactly.
 let hs=exact(['Home Spread','HomeSpread']),as=exact(['Away Spread','AwaySpread']);
 if(Number.isFinite(hs)||Number.isFinite(as)){
   if(!Number.isFinite(hs)&&Number.isFinite(as))hs=-as;
   if(!Number.isFinite(as)&&Number.isFinite(hs))as=-hs;
   return {homeSpread:hs,awaySpread:as,books:1};
 }
 // Sportsbook sheets can contain many "Book Home Spread" / "Book Away Spread" columns.
 // Use the median available market line so one outlier book does not control the model edge.
 const homes=[],aways=[];
 keys.forEach(k=>{
   const key=clean(k).toLowerCase(),n=numericSpread(raw[k]);
   if(!Number.isFinite(n))return;
   if(/home\s*spread|spread\s*home/.test(key))homes.push(n);
   else if(/away\s*spread|spread\s*away/.test(key))aways.push(n);
 });
 hs=medianNumber(homes);as=medianNumber(aways);
 if(!Number.isFinite(hs)&&Number.isFinite(as))hs=-as;
 if(!Number.isFinite(as)&&Number.isFinite(hs))as=-hs;
 return {homeSpread:hs,awaySpread:as,books:Math.max(homes.length,aways.length)};
}
function bettingModelMarketRows(){
 // Primary source is the Spreads sheet. Bets is used only to attach non-spread metadata
 // (moneyline/total/date) for the same matchup when available.
 return (state.spreadOdds||[]).map(sp=>{
   const line=spreadSheetLine(sp);
   const meta=(state.bets||[]).find(b=>oddsGameKey(b.home,b.away)===oddsGameKey(sp.home,sp.away))||{};
   return {date:meta.date||'',home:sp.home,away:sp.away,homeSpread:line.homeSpread,awaySpread:line.awaySpread,
     homeMoneyline:meta.homeMoneyline,awayMoneyline:meta.awayMoneyline,total:meta.total,spreadBookCount:line.books};
 });
}

function simulatorOptions(selected){

function simulatorResult(teamA,teamB,site){
 const a=teamByName(teamA),b=teamByName(teamB);
 if(!a||!b)return null;
 let margin=Number(a.rating)-Number(b.rating);
 let homeNote='Neutral field';
 if(site==='A'){margin+=3;homeNote=`${a.team} home field (+3)`}
 if(site==='B'){margin-=3;homeNote=`${b.team} home field (+3)`}
 const abs=Math.abs(margin);
 const winner=abs<0.05?null:(margin>0?a:b);
 const loser=winner?(winner.team===a.team?b:a):null;
 return {a,b,margin,abs,winner,loser,homeNote};
}
